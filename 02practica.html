<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">

    <title>PRACTICAS JAVASCRIPT</title>
</head>

<body>

<nav class="navbar bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">
            <img src="img/signos/cecyto.jpg" alt="Logo" width="30" height="24"
                class="d-inline-block align-text-top">
            PRACTICAS JAVASCRIPT
        </a>
    </div>
</nav>

<div class="container p-4 bg-info mt-5 card">

    <h1 class="text-center">PRACTICA 2</h1>
    <hr>

    <h2 class="text-center">CALCULADORA</h2>
    <br>

    <h5 id="valorNumeroA">NÚMERO 1</h5>

    <input type="range" class="form-control" id="numeroA"
        min="1" max="100" value="1">

    <h5 id="valorNumeroB">NÚMERO 2</h5>

    <input type="range" class="form-control" id="numeroB"
        min="1" max="100" value="1">

    <h5>SELECCIONAR OPERACIÓN</h5>

    <select class="form-control" id="operacion">
        <option value="suma">SUMA</option>
        <option value="resta">RESTA</option>
        <option value="multiplica">MULTIPLICACIÓN</option>
        <option value="divide">DIVISIÓN</option>
        <option value="modulo">MÓDULO</option>
        <option value="potencia">POTENCIA</option>
    </select>

    <h2 class="text-center mt-5 bg-danger card" id="resultado">
        RESULTADO
    </h2>

     <video controls class="w-100">
        <source src="img/video1.mp4" type="video/mp4">
        Tu navegador no puede reproducir este video.
    </video>


    <br>

</div>

<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/sweetalert2.all.min.js"></script>
<script src="js/02app.js"></script>

</body>
</html>
