   <script src="bootstrap.bundle.min.js"></script>

   <script>

   <script>
    function mensaje2(){
     Swal.fire({
  title: "Envia tu usuario de github",
  input: "text",
  inputAttributes: { autocapitalize: "off" },
  showCancelButton: true,
  confirmButtonText: "Enviar",
  showLoaderOnConfirm: true,
  preConfirm: async (login) => {
    try {
      const githubUrl = `
        https://api.github.com/users/${login}
      `;
      const response = await fetch(githubUrl);
      if (!response.ok) return Swal.showValidationMessage(`
          ${JSON.stringify(await response.json())}
        `);
      return response.json();
    } catch (error) {
      Swal.showValidationMessage(`
        Request failed: ${error}
      `);
    }
  },
  allowOutsideClick: () => !Swal.isLoading()
}).then((result) => {
  if (result.isConfirmed) Swal.fire({
    title: `${result.value.login}'s avatar`,
    imageUrl: result.value.avatar_url
  });
});
    }
   </script>

<script>

   <script>
    function mensaje5(){
    const swalWithBootstrapButtons = Swal.mixin({
  customClass: {
    confirmButton: "btn btn-success",
    cancelButton: "btn btn-danger"
  },
  buttonsStyling: false
});
swalWithBootstrapButtons.fire({
  title: "Estas seguro?",
  text: "No podras revertir esto",
  icon: "warning",
  showCancelButton: true,
  confirmButtonText: "Si, eliminalo",
  cancelButtonText: "Cancelar!",
  reverseButtons: true
}).then((result) => {
  if (result.isConfirmed) swalWithBootstrapButtons.fire({
    title: "Eliminado!",
    text: "Tu archivo esta eliminado",
    icon: "vale"
  });
  else if (result.dismiss === Swal.DismissReason.cancel)
 /* Read more about handling dismissals below */
  swalWithBootstrapButtons.fire({
    title: "Cancelar",
    text: "no se elimino :)",
    icon: "error"
  });
});
    }
   </script>

   <script>
    function mensaje9(){
     Swal.fire({
  title: " Quieres guardar los cambios?",
  showDenyButton: true,
  showCancelButton: true,
  confirmButtonText: "Guardar",
  denyButtonText: `No guardar`
}).then((result) => {
  /* Read more about isConfirmed, isDenied below */
  if (result.isConfirmed) Swal.fire("Guardado!", "", "success");
  else if (result.isDenied) Swal.fire("Los cambios no se guardaron", "", "info");
});
    }
   </script>
