<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CREDICOPPEL</title>

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">

</head>

<nav class="navbar bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="img/signos/portada.jpg" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                PRACTICAS JAVASCRIPT
            </a>
        </div>
    </nav>


<body onload="calcular()" style="background-color: #FCE4EC;">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">

                <div class="card shadow-lg border-0 rounded-4"
                     style="background-color: #FFF0F6; color: #880E4F;">

                   
                    <div class="card-header text-white text-center py-4 rounded-top-4"
                         style="background-color: #E6007E;">

                        <img src="img/signos/logo.jpg"
                             alt="Logo Liverpool"
                             width="150"
                             class="img-fluid mb-3">

                        <h1 class="fw-bold">CREDI LIVERPOOL</h1>
                        <p class="mb-0">Calcula tu compra a crédito</p>
                    </div>

                    <div class="card-body p-4 p-md-5">

                     
                        <div class="mb-4">
                           <label for="cantidad" class="form-label fw-bold" style="color: #E6007E;"></label>
                                <i class="bi bi-bag-fill"></i>
                                Producto
                            </label>

                            <select id="producto"
                                    class="form-select form-select-lg"
                                    onchange="calcular()">

                                <option value="tv">TENIS</option>
                                <option value="comedor">BOLSA</option>
                                <option value="lavadora">MOCHILA</option>
                                <option value="moto">CARRO</option>
                                <option value="sala">ELECTRODOMÉSTICOS</option>
                            </select>
                        </div>

                        
                        <div id="img" class="text-center mb-3"></div>

                        
                        <div id="precio"
                             class="alert text-center fw-bold fs-5"
                             style="background-color: #F8BBD0; color: #880E4F;">
                            Precio unitario: $1,200.00 MXN
                        </div>

                        <hr>

                        
                        <h4 class="fw-bold mb-3">
                            <i class="bi bi-calendar-check"></i>
                            Plazo de pago
                        </h4>

                        <div class="row g-3 mb-4">

                            <div class="col-12">
                                <label for="uno"
                                       class="border rounded-3 p-3 text-center d-block"
                                       style="border-color: #F48FB1 !important;">

                                    <input type="radio" name="plazo" id="uno"
                                           value="6" checked onchange="calcular()">

                                    <span class="fw-bold">6 meses</span>
                                    <br>
                                    <span>+10%</span>
                                </label>
                            </div>

                            <div class="col-12">
                                <label for="dos"
                                       class="border rounded-3 p-3 text-center d-block"
                                       style="border-color: #F48FB1 !important;">

                                    <input type="radio" name="plazo" id="dos"
                                           value="12" onchange="calcular()">

                                    <span class="fw-bold">12 meses</span>
                                    <br>
                                    <span>+15%</span>
                                </label>
                            </div>

                            <div class="col-12">
                                <label for="tres"
                                       class="border rounded-3 p-3 text-center d-block"
                                       style="border-color: #F48FB1 !important;">

                                    <input type="radio" name="plazo" id="tres"
                                           value="18" onchange="calcular()">

                                    <span class="fw-bold">18 meses</span>
                                    <br>
                                    <span>+20%</span>
                                </label>
                            </div>

                        </div>

                       
                        <div class="mb-4">
                            <label for="cantidad" class="form-label fw-bold">
                                <i class="bi bi-cart-plus"></i>
                                Cantidad de productos
                            </label>

                            <input type="number"
                                   id="cantidad"
                                   class="form-control form-control-lg"
                                   value="1"
                                   min="1"
                                   max="10"
                                   step="1"
                                   oninput="calcular()">

                            <div class="form-text">
                                Selecciona de 1 a 10 productos.
                            </div>
                        </div>

                        <hr>

                        
                        <h4 class="fw-bold text-center mb-3">
                            <i class="bi bi-calculator"></i>
                            Resumen de compra
                        </h4>

                        <div class="alert d-flex justify-content-between align-items-center"
                             style="background-color: #F8BBD0; color: #880E4F;">

                            <span>Precio de contado:</span>
                            <strong id="contado">$1,200.00 MXN</strong>
                        </div>

                        <div class="alert d-flex justify-content-between align-items-center"
                             style="background-color: #F48FB1; color: #4A0030;">

                            <span>Precio a crédito:</span>
                            <strong id="credito">$1,320.00 MXN</strong>
                        </div>

                        <div class="alert d-flex justify-content-between align-items-center mb-0"
                             style="background-color: #FCE4EC; color: #880E4F; border: 1px solid #F48FB1;">

                            <span>Abono mensual:</span>
                            <strong id="abono">$220.00 MXN</strong>
                        </div>

                        <p id="mensaje" class="text-center mt-3 mb-0"></p>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/05creditos.js"></script>

</body>
</html>
